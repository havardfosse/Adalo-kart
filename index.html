<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mitt kart</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    // Opprett kartet
    const map = L.map("map").setView(
      [63.4305, 10.3951],
      13
    );

    // OpenStreetMap
    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    // MARKØR
    const marker = L.marker([
      63.4305,
      10.3951
    ]).addTo(map);

    marker.bindPopup(
      "<b>Eksempelpunkt</b><br>Trykkbare punkter fungerer!"
    );


    // SONE
    const sone1 = L.polygon([
      [63.4320, 10.3880],
      [63.4340, 10.3940],
      [63.4315, 10.4010],
      [63.4285, 10.3970],
      [63.4290, 10.3900]
    ], {
      color: "#2563eb",
      fillColor: "#3b82f6",
      fillOpacity: 0.35
    }).addTo(map);

    sone1.bindPopup(
      "<b>Sone 1</b><br>Dette er vår første sone."
    );


    // RUTE
    const rute1 = L.polyline([
      [63.4275, 10.3870],
      [63.4290, 10.3900],
      [63.4310, 10.3940],
      [63.4330, 10.3990],
      [63.4350, 10.4020]
    ], {
      color: "#dc2626",
      weight: 5
    }).addTo(map);

    rute1.bindPopup(
      "<b>Rute 1</b><br>Dette er en eksempelrute."
    );

  </script>

</body>
</html>
