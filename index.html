<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12372a" />
  <title>Rutekart</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #dce9d8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Kartet fyller hele Adalo WebView. Ingen toppmeny eller bunnmeny. */
    #map { position: fixed; inset: 0; }

    .leaflet-control-container .leaflet-top {
      top: max(8px, env(safe-area-inset-top));
    }

    .leaflet-control-container .leaflet-bottom {
      bottom: max(8px, env(safe-area-inset-bottom));
    }

    .leaflet-bar {
      border: 0 !important;
      border-radius: 12px !important;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(8, 38, 28, .22) !important;
    }

    .leaflet-bar a {
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      border: 0 !important;
      border-bottom: 1px solid #e6ece8 !important;
      color: #12372a !important;
      background-color: rgba(255,255,255,.97) !important;
    }

    .leaflet-bar a:last-child { border-bottom: 0 !important; }
    .leaflet-draw-toolbar a { background-size: 300px 30px; }
    .leaflet-control-attribution { font-size: 8px; }

    .status {
      position: fixed;
      z-index: 1000;
      left: 50%;
      top: max(12px, env(safe-area-inset-top));
      transform: translateX(-50%);
      max-width: calc(100vw - 150px);
      padding: 9px 13px;
      border-radius: 999px;
      color: white;
      background: rgba(18,55,42,.92);
      box-shadow: 0 6px 20px rgba(8,38,28,.22);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .status.show { opacity: 1; }

    .save-control {
      background: #12372a !important;
      color: white !important;
      font-size: 20px;
      text-align: center;
      text-decoration: none;
    }

    .locate-control {
      font-size: 22px;
      text-align: center;
      text-decoration: none;
    }

    .route-popup strong { color: #12372a; }
    .route-popup small { display: block; margin-top: 4px; color: #68766f; }
  </style>
</head>
<body>
  <div id="map" aria-label="Kart for tegning og redigering av ruter"></div>
  <div id="status" class="status" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <script>
    "use strict";

    // URL-eksempel fra Adalo:
    // https://bruker.github.io/adalo-kart/?userId=123&routeId=45&mode=edit
    //
    // Valgfritt webhook-endepunkt:
    // &eventEndpoint=https%3A%2F%2Fdin-server.no%2Fmap-events

    const params = new URLSearchParams(window.location.search);

    const CONFIG = {
      userId: params.get("userId") || "demo-user",
      routeId: params.get("routeId") || "demo-route",
      eventEndpoint: params.get("eventEndpoint") || "",
      mode: params.get("mode") || "edit",
      center: [63.4305, 10.3951],
      zoom: 14
    };

    const map = L.map("map", {
      zoomControl: true,
      attributionControl: true
    }).setView(CONFIG.center, CONFIG.zoom);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap-bidragsytere"
    }).addTo(map);

    const editableLayers = new L.FeatureGroup();
    map.addLayer(editableLayers);

    const storageKey = `adalo-map-${CONFIG.userId}-${CONFIG.routeId}`;
    let statusTimer;

    function showStatus(message, duration = 2200) {
      const node = document.getElementById("status");
      node.textContent = message;
      node.classList.add("show");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => node.classList.remove("show"), duration);
    }

    function styleFeature(feature) {
      const type = feature?.geometry?.type;
      if (type === "Polygon" || type === "MultiPolygon") {
        return { color: "#2563eb", weight: 3, fillColor: "#3b82f6", fillOpacity: .22 };
      }
      return { color: "#dc2626", weight: 5, opacity: .92 };
    }

    function bindLayerPopup(layer) {
      const type = layer instanceof L.Polygon && !(layer instanceof L.Rectangle)
        ? "Sone"
        : layer instanceof L.Polyline
          ? "Rute"
          : layer instanceof L.Marker
            ? "Punkt"
            : "Kartobjekt";

      layer.bindPopup(`<div class="route-popup"><strong>${type}</strong><small>Bruk redigeringsverktøyet for å flytte eller endre objektet.</small></div>`);
    }

    function exportGeoJson() {
      const data = editableLayers.toGeoJSON();
      data.properties = {
        routeId: CONFIG.routeId,
        userId: CONFIG.userId,
        updatedAt: new Date().toISOString()
      };
      return data;
    }

    function persistLocal() {
      localStorage.setItem(storageKey, JSON.stringify(exportGeoJson()));
    }

    async function publishEvent(type, extra = {}) {
      const event = {
        source: "ADALO_LEAFLET_EDITOR",
        type,
        userId: CONFIG.userId,
        routeId: CONFIG.routeId,
        timestamp: new Date().toISOString(),
        geojson: exportGeoJson(),
        ...extra
      };

      // Kan fanges opp hvis kartet ligger i en ordinær iframe/webside.
      window.parent.postMessage(event, "*");
      window.dispatchEvent(new CustomEvent("adalo-map-event", { detail: event }));

      // Faktisk sending til Adalo bør gå via en sikker webhook/server.
      // Ikke legg Adalo API-nøkkelen direkte i offentlig JavaScript.
      if (CONFIG.eventEndpoint) {
        const response = await fetch(CONFIG.eventEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(event),
          mode: "cors"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      }

      return event;
    }

    function loadGeoJson(data) {
      if (!data || !data.features) return false;

      L.geoJSON(data, {
        style: styleFeature,
        pointToLayer: (_, latlng) => L.marker(latlng),
        onEachFeature: (_, layer) => {
          editableLayers.addLayer(layer);
          bindLayerPopup(layer);
        }
      });

      if (editableLayers.getLayers().length) {
        map.fitBounds(editableLayers.getBounds(), { padding: [35, 35] });
        return true;
      }
      return false;
    }

    function loadInitialData() {
      // 1. GeoJSON kan sendes inn fra Adalo som URL-kodet tekst.
      const incoming = params.get("geojson");
      if (incoming) {
        try {
          if (loadGeoJson(JSON.parse(incoming))) {
            showStatus("Rute lastet fra Adalo");
            return;
          }
        } catch (error) {
          console.warn("Ugyldig GeoJSON i URL", error);
        }
      }

      // 2. Ellers lastes sist lagrede versjon på denne enheten.
      try {
        const local = JSON.parse(localStorage.getItem(storageKey) || "null");
        if (loadGeoJson(local)) {
          showStatus("Lokalt lagret rute lastet");
          return;
        }
      } catch (error) {
        console.warn("Kunne ikke lese lokal rute", error);
      }

      // 3. En kort eksempelrute første gang kartet åpnes.
      const demo = L.polyline([
        [63.4305, 10.3951],
        [63.4313, 10.3990],
        [63.4330, 10.4028],
        [63.4348, 10.4064]
      ], { color: "#dc2626", weight: 5, opacity: .92 });
      editableLayers.addLayer(demo);
      bindLayerPopup(demo);
      map.fitBounds(demo.getBounds(), { padding: [35, 35] });
    }

    if (CONFIG.mode === "edit") {
      const drawControl = new L.Control.Draw({
        position: "topleft",
        draw: {
          polyline: {
            shapeOptions: { color: "#dc2626", weight: 5, opacity: .92 },
            showLength: true,
            metric: true
          },
          polygon: {
            allowIntersection: false,
            showArea: true,
            metric: true,
            shapeOptions: { color: "#2563eb", weight: 3, fillColor: "#3b82f6", fillOpacity: .22 }
          },
          marker: true,
          rectangle: false,
          circle: false,
          circlemarker: false
        },
        edit: {
          featureGroup: editableLayers,
          edit: true,
          remove: true
        }
      });
      map.addControl(drawControl);
    }

    map.on(L.Draw.Event.CREATED, event => {
      editableLayers.addLayer(event.layer);
      bindLayerPopup(event.layer);
      persistLocal();
      publishEvent("map_object_created", { layerType: event.layerType }).catch(console.warn);
      showStatus("Objekt opprettet");
    });

    map.on(L.Draw.Event.EDITED, event => {
      persistLocal();
      publishEvent("map_objects_edited", { changedCount: event.layers.getLayers().length }).catch(console.warn);
      showStatus("Endringer lagret lokalt");
    });

    map.on(L.Draw.Event.DELETED, event => {
      persistLocal();
      publishEvent("map_objects_deleted", { deletedCount: event.layers.getLayers().length }).catch(console.warn);
      showStatus("Objekt slettet");
    });

    // Minimal lagreknapp som kartkontroll, ikke en egen appmeny.
    const SaveControl = L.Control.extend({
      options: { position: "topright" },
      onAdd() {
        const container = L.DomUtil.create("div", "leaflet-bar");
        const button = L.DomUtil.create("a", "save-control", container);
        button.href = "#";
        button.title = "Lagre rute";
        button.setAttribute("aria-label", "Lagre rute");
        button.innerHTML = "✓";
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.on(button, "click", async event => {
          L.DomEvent.preventDefault(event);
          persistLocal();
          try {
            await publishEvent("route_saved");
            showStatus(CONFIG.eventEndpoint ? "Rute sendt og lagret" : "Rute lagret på enheten");
          } catch (error) {
            console.error(error);
            showStatus("Lokalt lagret, men sending mislyktes", 3500);
          }
        });
        return container;
      }
    });
    map.addControl(new SaveControl());

    const LocateControl = L.Control.extend({
      options: { position: "bottomright" },
      onAdd() {
        const container = L.DomUtil.create("div", "leaflet-bar");
        const button = L.DomUtil.create("a", "locate-control", container);
        button.href = "#";
        button.title = "Finn min posisjon";
        button.setAttribute("aria-label", "Finn min posisjon");
        button.innerHTML = "◎";
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.on(button, "click", event => {
          L.DomEvent.preventDefault(event);
          if (!navigator.geolocation) return showStatus("GPS støttes ikke");
          navigator.geolocation.getCurrentPosition(
            position => {
              const latlng = [position.coords.latitude, position.coords.longitude];
              map.setView(latlng, 17);
              L.circleMarker(latlng, {
                radius: 8, color: "white", weight: 4,
                fillColor: "#3283f5", fillOpacity: 1
              }).addTo(map).bindPopup("Din posisjon").openPopup();
            },
            () => showStatus("Fikk ikke tilgang til posisjon"),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });
        return container;
      }
    });
    map.addControl(new LocateControl());

    loadInitialData();
    setTimeout(() => map.invalidateSize(), 250);

    // Tilgjengelig i nettleserkonsollen ved testing.
    window.AdaloMapEditor = {
      getGeoJson: exportGeoJson,
      save: () => publishEvent("route_saved"),
      clear: () => {
        editableLayers.clearLayers();
        persistLocal();
      }
    };
  </script>
</body>
</html>
